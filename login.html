<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PuzzleBox - Login</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        .navbar-brand { font-weight: 800; letter-spacing: 1px; }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
      <div class="container">
        <a class="navbar-brand text-uppercase" href="index.html">PuzzleBox</a>
        
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="archive.html">Archive</a></li>
            <li class="nav-item"><a class="nav-link" href="leaderboard.html">Leaderboard</a></li>
            
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle text-warning" href="#" id="gamesDrop" role="button" data-bs-toggle="dropdown">
                Play Games
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="wordle.html">Wordle</a></li>
                <li><a class="dropdown-item" href="trivia.html">Trivia</a></li>
                <li><a class="dropdown-item" href="connections.html">Connections</a></li>
              </ul>
            </li>
            <li class="nav-item ms-lg-3">
              <a class="nav-link active fw-bold text-white" href="login.html">Login / Register</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow border-0 rounded-3">
                    <div class="card-body p-4 p-md-5">
                        <h2 class="text-center mb-4 fw-bold">Welcome Back</h2>
                        
                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email address</label>
                                <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" required>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">Login</button>
                            </div>
                        </form>
                        
                        <div class="text-center mt-4">
                            <p class="mb-0">Don't have a PuzzleBox Account? <a href="register.html" class="text-decoration-none fw-bold text-warning">Register here</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
